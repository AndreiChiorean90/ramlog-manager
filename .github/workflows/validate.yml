name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  syntax-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python programs
        run: python -m py_compile bin/ramlog bin/ramlog-web
      - name: Check installer shell syntax
        run: bash -n install.sh
      - name: Verify systemd units
        run: systemd-analyze verify systemd/ramlog-export.service systemd/ramlog-web.service
